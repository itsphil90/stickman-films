name: Render stickman film

on:
  workflow_dispatch:
    inputs:
      style:
        description: "Render style (2D is faster, 3D adds real camera moves)"
        required: true
        type: choice
        options: ["2D", "3D"]
        default: "2D"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          pip install numpy scipy pillow playwright imageio-ffmpeg
          playwright install-deps
          playwright install chromium

      - name: Render film
        run: |
          cd stickman
          python scripts/build.py film --out my-film.mp4

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stickman-film-${{ inputs.style }}
          path: stickman/film/my-film.mp4
