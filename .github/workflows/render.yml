name: Render stickman film

on:
  workflow_dispatch:
    inputs:
      style:
        description: "Render style (2D is faster, 3D adds real camera moves)"
        required: true
        type: choice
        options: ["2D", "3D"]
        default: "2D"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python deps
        working-directory: stickman
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pillow playwright imageio-ffmpeg

      - name: Setup Node (3D only)
        if: inputs.style == '3D'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Chromium
        working-directory: stickman
        run: python -m playwright install --with-deps chromium

      - name: Prepare film folder
        working-directory: stickman
        shell: bash
        run: |
          if [ -f film/film.js ]; then
            echo "Using committed film/film.js"
          elif [ "${{ inputs.style }}" = "3D" ]; then
            python scripts/new_film.py film --3d
          else
            python scripts/new_film.py film
          fi

      - name: Render film
        working-directory: stickman
        shell: bash
        run: python scripts/build.py film --out my-film.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: stickman-film-${{ inputs.style }}
          path: stickman/film/my-film.mp4